<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Pixel-Ops UAV photogrammetry prototype — real Lighthouse reconstruction artifacts." />
  <title>Pixel-Ops | UAV Photogrammetry</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="home" aria-label="Go home"><span class="brand-copy"><strong>PIXEL-OPS</strong><small>CV / Photogrammetry Engine</small></span></button>
      <nav class="topnav" aria-label="Primary">
        <button data-nav="home">Home</button><button data-nav="new">New Reconstruction</button><button data-nav="processing">Processing</button><button data-nav="workspace">Workspace</button><button data-nav="pipeline">Pipeline</button><button data-nav="docs">Documentation</button>
      </nav>
      <div class="top-actions"><span class="status-chip"><i></i>VERCEL DEMO READY</span></div>
    </header>
    <aside class="sidebar">
      <div>
        <div class="side-label">PROJECT</div>
        <div class="project-card"><div class="project-icon">⌁</div><div><strong>Lighthouse Survey</strong><small>Submitted reconstruction</small></div></div>
        <div class="side-label">WORKSPACE</div>
        <button class="side-link" data-nav="new"><span>＋</span>Image Ingest</button>
        <button class="side-link" data-nav="processing"><span>◌</span>Pipeline Run</button>
        <button class="side-link" data-nav="workspace"><span>◇</span>3D Viewer</button>
        <button class="side-link" data-nav="pipeline"><span>⌘</span>Architecture</button>
        <button class="side-link" data-nav="docs"><span>▤</span>Docs & Source</button>
      </div>
      <div class="side-footer"><div><span>Submitted run</span><strong>45.2 s</strong></div><div><span>Registered views</span><strong>10 / 12</strong></div><div><span>Final cloud</span><strong>1,161 pts</strong></div></div>
    </aside>
    <main id="app" class="content" tabindex="-1"></main>
  </div>

  <template id="tpl-home"><section class="page page-home"><div class="hero-grid"><div class="hero-copy"><div class="eyebrow">UAV PHOTOGRAMMETRY · LIGHTHOUSE SUBMISSION</div><h1>Turn overlapping images into a <span>3D reconstruction.</span></h1><p>Pixel-Ops is a self-developed computer-vision pipeline for feature matching, camera pose recovery, sparse 3D reconstruction, stereo depth and Poisson meshing.</p><div class="hero-actions"><button class="btn btn-primary" data-nav="new">Start Reconstruction</button><button class="btn btn-ghost" data-nav="workspace">Open Working Demo</button></div><div class="mini-metrics"><div><strong>12</strong><span>images</span></div><div><strong>27</strong><span>verified pairs</span></div><div><strong>10</strong><span>registered cameras</span></div><div><strong>45.2s</strong><span>runtime</span></div></div></div><div class="hero-visual card"><div class="card-top"><span>SUBMITTED RESULT</span><b class="good">● VERIFIED</b></div><div class="placeholder-visual">PIXEL-OPS<br><small>Lighthouse 3D Reconstruction</small></div><div class="visual-footer"><span>5,493 vertices</span><span>10,829 triangles</span><span>Vertex-coloured</span></div></div></div><div class="pipeline-strip"><div><b>01</b><span>SIFT</span><small>Find features</small></div><em>→</em><div><b>02</b><span>FLANN + Lowe</span><small>Match features</small></div><em>→</em><div><b>03</b><span>RANSAC</span><small>Verify geometry</small></div><em>→</em><div><b>04</b><span>SfM + PnP</span><small>Recover cameras</small></div><em>→</em><div><b>05</b><span>SGBM</span><small>Depth maps</small></div><em>→</em><div><b>06</b><span>Poisson</span><small>3D mesh</small></div></div></section></template>

  <template id="tpl-new"><section class="page"><div class="page-head"><div><div class="eyebrow">PROJECT / LIGHTHOUSE / NEW RECONSTRUCTION</div><h2>New Reconstruction</h2><p>Select UAV photographs or use the submitted Lighthouse demo dataset.</p></div></div><div class="dropzone"><div class="upload-icon">⇧</div><h3>Drop Lighthouse / UAV images here</h3><p>JPG, JPEG, PNG</p><label class="btn btn-ghost">Browse Images<input id="fileInput" type="file" accept="image/*" multiple hidden></label></div><div class="card dataset-card"><div class="card-top"><span>INPUT SET</span><b id="validationBadge">DEMO DATASET</b></div><div id="fileGrid" class="file-grid"></div><div class="dataset-actions"><button id="clearFiles" class="btn btn-ghost compact">Clear</button><button id="startRun" class="btn btn-primary">Start Reconstruction</button></div></div></section></template>

  <template id="tpl-processing"><section class="page"><div class="page-head"><div><div class="eyebrow">SUBMITTED RUN · LIGHTHOUSE SURVEY</div><h2>Processing Pipeline</h2><p>Verified run: 45.2 seconds.</p></div><button id="replayRun" class="btn btn-ghost compact">Replay Stages</button></div><div class="card progress-card"><div class="progress-head"><div><span id="progressStatus" class="good">RECONSTRUCTION COMPLETE</span><small id="progressStage">9 of 9 stages</small></div><strong id="progressPct">100%</strong></div><div class="progress-track"><div id="progressBar" class="progress-bar" style="width:100%"></div></div></div><div id="stageGrid" class="stage-grid"></div><div class="card metrics-panel"><div class="card-top"><span>ACTUAL RUN METRICS</span><b>run_summary.json</b></div><div id="processingMetrics" class="metric-list"></div><button class="btn btn-primary full" data-nav="workspace">Open Reconstruction Workspace</button></div></section></template>

  <template id="tpl-workspace"><section class="page"><div class="page-head"><div><div class="eyebrow">PROJECT / LIGHTHOUSE SURVEY</div><h2>Reconstruction Workspace</h2><p>Submitted geometry and statistics.</p></div></div><div class="grid-3"><article class="card info-card"><h3>Point Cloud</h3><p>1,161 final filtered SfM points.</p></article><article class="card info-card"><h3>3D Mesh</h3><p>5,493 vertices · 10,829 triangles.</p></article><article class="card info-card"><h3>Depth Maps</h3><p>5 validated SGBM depth maps.</p></article></div><div class="card limitation"><div><strong>Known limitation</strong><p>Dense multi-view depth fusion was not used in the submitted final cloud. The final geometry prioritises the more reliable SfM reconstruction.</p></div></div></section></template>

  <template id="tpl-pipeline"><section class="page"><div class="page-head"><div><div class="eyebrow">TECHNICAL ARCHITECTURE</div><h2>How Pixel-Ops Builds 3D Geometry</h2></div></div><div class="architecture"><article class="arch-card"><b>01</b><h3>Input Images</h3><p>Load overlapping Lighthouse photographs.</p></article><article class="arch-card"><b>02</b><h3>SIFT</h3><p>Detect distinctive keypoints and descriptors.</p></article><article class="arch-card"><b>03</b><h3>FLANN + Lowe</h3><p>Match descriptors and reject ambiguous matches.</p></article><article class="arch-card"><b>04</b><h3>RANSAC</h3><p>Keep geometrically consistent matches.</p></article><article class="arch-card"><b>05</b><h3>SfM + PnP</h3><p>Estimate camera poses and triangulate sparse 3D points.</p></article><article class="arch-card"><b>06</b><h3>SGBM</h3><p>Create stereo depth maps.</p></article><article class="arch-card"><b>07</b><h3>Filtering</h3><p>Voxel and statistical outlier removal.</p></article><article class="arch-card"><b>08</b><h3>Poisson</h3><p>Create the vertex-coloured triangular mesh.</p></article></div></section></template>

  <template id="tpl-docs"><section class="page"><div class="page-head"><div><div class="eyebrow">DOCUMENTATION & SOURCE</div><h2>Submission Evidence</h2><p>The Python backend source is included in this repository.</p></div></div><div class="grid-3"><article class="card info-card"><h3>features.py</h3><p>SIFT · FLANN · Lowe · RANSAC</p></article><article class="card info-card"><h3>sfm.py</h3><p>Essential Matrix · PnP · triangulation</p></article><article class="card info-card"><h3>depth.py</h3><p>Rectification · SGBM · depth</p></article></div></section></template>

  <script type="module" src="./app.js"></script>
</body>
</html>
